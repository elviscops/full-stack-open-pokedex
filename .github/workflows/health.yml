name: health-check
on:
  push:
    branches: [main]
jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        uses: Jtalk/url-health-check-action@v4
        with:
          url: https://full-stack-open-pokedex-0e6w.onrender.com/health|https://full-stack-open-pokedex-0e6w.onrender.com/health
          follow-redirect: false
          max-attempts: 2
          retry-delay: 5s
          retry-all: false